name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Translations, data and glossary rules
        run: npm run check:messages
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://ichalkaranji.example
